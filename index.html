<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鮒コース タイムアタック</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#14060a;color:#f4e4d8;font-family:'DotGothic16',monospace;}
  body{display:flex;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:640px;padding:8px 8px 20px}
  h1{font-size:15px;margin:4px 0 8px;font-weight:normal;color:#ffd9a0;letter-spacing:.05em}
  #hud{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:0 2px 4px}
  #hud .sec{color:#ffd24a}
  #hud .spd{color:#ffb347}
  #hud .time{color:#7ee07a}
  #wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:2px solid #3a1a22;touch-action:none;user-select:none}
  canvas#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,6,10,.74);text-align:center;padding:16px}
  .overlay.hidden{display:none}
  .overlay .big{font-size:20px;color:#ffd9a0;line-height:1.5}
  .overlay .small{font-size:13px;color:#e9c9b8;line-height:1.7}
  #ovCount{background:transparent;pointer-events:none}
  #cdNum{font-size:64px;color:#fff3b0;text-shadow:0 0 12px #000,2px 2px 0 #b8323a}
  #msg{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:20px;color:#fff3b0;text-shadow:0 0 6px #000,2px 2px 0 #b8323a;pointer-events:none;opacity:0;transition:opacity .15s}
  #msg.on{opacity:1}
  button{font-family:inherit;color:#fff;background:#b8323a;border:2px solid #ffb0a0;border-radius:8px;padding:10px 22px;font-size:17px}
  button:active{background:#8a2028}
  #bar{display:flex;height:10px;margin-top:8px;border:1px solid #3a1a22;position:relative}
  #bar div.seg{height:100%}
  #mark{position:absolute;top:-4px;width:6px;height:18px;background:#fff;border:1px solid #14060a;transform:translateX(-3px);left:0}
  #gaugeRow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:#ffb347}
  #gauge{flex:1;height:12px;border:1px solid #7a4a50;background:#2a1018}
  #gaugeFill{height:100%;width:100%;background:#ffb347}
  #ctl{display:flex;gap:8px;margin-top:8px;align-items:stretch}
  .steer{flex:1;font-size:26px;padding:20px 0;touch-action:none;user-select:none}
  #btnBoost{flex:1.1;font-size:18px;background:#d98a1e;border-color:#ffe0a0;touch-action:none;user-select:none}
  #btnBoost:active{background:#a8660e}
  .hint{font-size:12px;color:#b89a8c;margin-top:10px;line-height:1.7}
  #best{color:#ffd9a0}
  #fishBar{display:block;width:100%;margin-top:8px}
  #select{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px 4px;min-height:82vh}
  #selTitle{font-size:20px;color:#ffd9a0;line-height:1.5}
  #selSub{font-size:13px;color:#e9c9b8;line-height:1.7}
  #faceWrap{position:relative;width:min(78vw,330px);aspect-ratio:1;overflow:hidden;border-radius:18px;border:2px solid #3a1a22;background:radial-gradient(circle at 50% 45%,#1f7f92 0,#0d3a4a 70%,#08202b 100%)}
  #faceImg{width:100%;height:100%;display:block;image-rendering:pixelated;transform-origin:50% 68%;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
  #faceWrap.zoom #faceImg{animation:none;transform:scale(11);transition:transform 1s cubic-bezier(.5,0,.9,.55)}
  #faceFade{position:absolute;inset:0;background:#14060a;opacity:0;transition:opacity .3s .7s}
  #faceWrap.zoom #faceFade{opacity:1}
  #btnStart{font-size:20px;padding:14px 34px}
  .btnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btnRow button{padding:9px 16px;font-size:15px}
  #btnMenu{background:#4a2a34;border-color:#a88a90}
  #bang{position:absolute;right:6%;top:8%;font-size:44px;color:#fff;text-shadow:0 0 8px #000,3px 3px 0 #d02020;pointer-events:none;opacity:0;transform-origin:center}
  #bang.s1{font-size:30px;opacity:1}
  #bang.s2{font-size:56px;opacity:1}
  #bang.s3{font-size:50px;opacity:1;right:50%;transform:translateX(50%);top:30%;letter-spacing:.05em}
  #hpRow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#ff9a8a}
  #hp{flex:1;height:12px;border:1px solid #7a4a50;background:#2a1018}
  #hpFill{height:100%;width:100%;background:#e0524a}
  #hpNum{width:3.2em;text-align:right}
</style>
</head>
<body>
<div id="app">
  <div id="select">
    <div id="selTitle">今日は鮒を走っちゃう？</div>

  var a=2150,b=2900,ramp=150;
  if(w<=a-ramp||w>=b+ramp) return 1;
  var t;
  if(w<a) t=(w-(a-ramp))/ramp; else if(w>b) t=1-(w-b)/ramp; else t=1;
  t=t*t*(3-2*t);
  return 1-0.3*t;
}
function curveSeg(idx){
  var w=idx*ZSTEP;
  var c=Math.sin(w/310)*1.1+Math.sin(w/113+1.3)*0.6;
  return c*sectionAt(w).curv;
}

/* ---------- color helpers ---------- */
var cache={};
function rgb(h){
  if(cache[h]) return cache[h];
  var n=parseInt(h.slice(1),16);
  return (cache[h]=[(n>>16)&255,(n>>8)&255,n&255]);
}
function hex2(v){ var s=Math.round(v).toString(16); return s.length<2?'0'+s:s; }
function mixc(a,b,t){
  t=Math.max(0,Math.min(1,t)); t=Math.round(t*8)/8;
  var A=rgb(a),B=rgb(b);
  return '#'+hex2(A[0]+(B[0]-A[0])*t)+hex2(A[1]+(B[1]-A[1])*t)+hex2(A[2]+(B[2]-A[2])*t);
}
function hash(n){ var x=Math.sin(n*12.9898)*43758.5453; return x-Math.floor(x); }

/* ---------- drawing helpers ---------- */
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function fillCircle(cx,cy,r,col){
  ctx.fillStyle=col;
  var y0=Math.max(0,Math.ceil(cy-r)), y1=Math.min(H-1,Math.floor(cy+r)), r2=r*r;
  for(var y=y0;y<=y1;y++){
    var dy=y+0.5-cy, q=r2-dy*dy;
    if(q<0) continue;
    var d=Math.sqrt(q), a=Math.round(cx-d), b=Math.round(cx+d);
    if(b>a) ctx.fillRect(a,y,b-a,1);
  }
}
function pie(cx,cy,r,a0,a1,col){
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath(); ctx.fill();
}
function poly(pts,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(pts[0],pts[1]);
  for(var i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath(); ctx.fill();
}
/* a ring of teeth/muscle with one gap centered at gapDeg */
function drawGateRing(cx,cy,r,o,dark){
  var ro=r*0.98, ri=r*(o.kind==='teeth'?0.52:0.45);
  var span=360-2*o.half;
  var step=(o.kind==='teeth')?15:8;
  var cnt=Math.round(span/step);
  var wid=(o.kind==='teeth')?12:8.6;
  var colA=o.kind==='teeth'?'#efe5d0':'#e8909a';
  var colB=o.kind==='teeth'?'#d6c8ae':'#d8808c';
  for(var k=0;k<cnt;k++){
    var a0=(o.gap+o.half+k*step)*DEG, a1=(o.gap+o.half+k*step+wid)*DEG;
    var c=mixc((k&1)?colA:colB,'#1a0810',dark);
    poly([cx+ro*Math.cos(a0),cy+ro*Math.sin(a0),
          cx+ro*Math.cos(a1),cy+ro*Math.sin(a1),
          cx+ri*Math.cos(a1),cy+ri*Math.sin(a1),
          cx+ri*Math.cos(a0),cy+ri*Math.sin(a0)],c);
  }
}

var camX=0,camY=0;
var EXIT_T=3.0;
function renderExit(t){
  var i,k;
  ctx.save();
  ctx.translate(camX,camY);
  /* water */
  for(i=0;i<24;i++) rect(-10,i*10,W+20,10,mixc('#43eef0','#1584ad',i/23));
  for(k=0;k<6;k++){ var rx=((k*61+t*8)%(W+60))-30; rect(Math.round(rx),0,6,H,'rgba(255,255,255,0.05)'); }
  /* fish rear: peduncle + tail */
  ctx.fillStyle='#5f7d3a'; ctx.strokeStyle='#1a1a22'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(150,92); ctx.lineTo(222,100); ctx.lineTo(262,52); ctx.lineTo(276,112); ctx.lineTo(262,170); ctx.lineTo(222,126); ctx.lineTo(150,140); ctx.closePath(); ctx.fill(); ctx.stroke();
  /* body */
  ctx.fillStyle='#8c8a3c';
  ctx.beginPath(); ctx.ellipse(40,122,134,88,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#6d8a3a';
  ctx.beginPath(); ctx.ellipse(40,122,134,88,0,Math.PI*1.12,Math.PI*1.88); ctx.fill();
  ctx.fillStyle='#a8a14a';
  ctx.beginPath(); ctx.ellipse(40,150,120,48,0,0.1,Math.PI-0.1); ctx.fill();
  for(k=0;k<5;k++){ rect(40+k*24,70+((k*17)%30),14,2,'rgba(40,50,20,0.35)'); }
  /* cutaway tube */
  rect(0,106,168,44,'#c06a74');
  rect(0,111,168,34,'#4a1424');
  rect(0,111,168,3,'#7a3048'); rect(0,142,168,3,'#7a3048');
  var run=Math.min(1,Math.max(0,(t-0.3)/1.1));
  for(k=0;k<12;k++){ var lx=(((k*16-t*260)%176)+176)%176; rect(Math.round(lx),114,2,28,'#7a3048'); }
  /* anus */
  fillCircle(172,128,9,'#c96a74'); fillCircle(172,128,5,'#4a1424');
  /* car */
  var cxp,cyp=128;
  if(t<1.4){ var e=run*run; cxp=-30+200*e; }
  else { var u=Math.min(1,(t-1.4)/1.2); var ue=1-(1-u)*(1-u); cxp=170+66*ue; cyp=128+26*ue; }
  if(t>=0.3 && t<1.4){
    for(k=0;k<7;k++){
      var sy=116+((k*11)%26), sx=(((k*53-t*700)%170)+170)%170;
      rect(Math.round(sx),sy,10+(k%3)*6,1,'#ffe8d0');
    }
  }
  /* bubbles */
  for(k=0;k<16;k++){
    var ti=1.4+k*0.06, dtb=t-ti;
    if(dtb>0){
      var hh=hash(k*13+5);
      var bx=176+dtb*(34+hh*40), by=128-dtb*(10+hh*34)+Math.sin(dtb*6+k)*3, br=2+hh*4;
      ctx.strokeStyle='rgba(230,255,255,0.9)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.stroke();
    }
  }
  ctx.save();
  ctx.translate(cxp,cyp);
  ctx.rotate(Math.PI/2);
  ctx.scale(0.72,0.72);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(carC,-16,-24);
  ctx.restore();
  ctx.restore();
  if(t<0.35){ ctx.fillStyle='rgba(20,6,10,'+(1-t/0.35).toFixed(2)+')'; ctx.fillRect(0,0,W,H); }
}
function render(){
  if(S.state==='exit'||S.state==='done'){
    renderExit(S.exitT);
    if(S.flash>0.01){ ctx.fillStyle='rgba(255,60,40,'+(S.flash*0.3).toFixed(2)+')'; ctx.fillRect(0,0,W,H); }
    return;
  }
  rect(0,0,W,H,'#14060a');
  var pos=S.pos;
  var b=Math.floor(pos/ZSTEP), frac=pos/ZSTEP-b;
  var rings=[], ox=0, dx=-curveSeg(b)*0.05*frac, cap=-1, i;
  var ccy=CY+camY;
  for(i=0;i<N;i++){
    var idx=b+i, w=(idx+1)*ZSTEP, z=i+1-frac, r=R0*rs(w)/z;
    rings.push({idx:idx,w:w,z:z,r:r,cx:W/2+ox+camX,cy:ccy,sec:sectionAt(w)});
    ox+=dx; dx+=curveSeg(idx)*0.05;
    if(w>=END){ cap=i; break; }
  }
  var L=rings.length;
  /* walls near -> far */
  for(i=0;i<L;i++){
    var g=rings[i];
    if(i===cap){
      fillCircle(g.cx,g.cy,g.r,'#ffb347');
      fillCircle(g.cx,g.cy,g.r*0.82,'#ffd98a');
      fillCircle(g.cx,g.cy,g.r*0.5,'#e8895a');
      for(var s=0;s<8;s++){
        var an=s/8*Math.PI*2+0.2;
        for(var st=g.r*0.08;st<g.r*0.78;st+=1){
          rect(Math.round(g.cx+Math.cos(an)*st),Math.round(g.cy+Math.sin(an)*st),1,1,'#8a3a30');
        }
      }
      fillCircle(g.cx,g.cy,Math.max(1,g.r*0.1),'#4a1a1a');
      continue;
    }
    var t=i/N, dark=Math.min(0.6,t*0.65);
    var wc=mixc(g.sec.wall[g.idx&1],'#1a0810',dark);
    if(i>=N-6) wc=mixc(wc,g.sec.glow,(i-(N-6)+1)/6*0.92);
    fillCircle(g.cx,g.cy,g.r,wc);
    var zone=zoneAt(g.w);
    if(zone){
      var psi=waveCenter(zone,g.w);
      var ph=Math.sin(g.w*0.05-S.clock*6);
      var base=g.sec.wall[g.idx&1];
      var wcol=ph>0?mixc(base,'#ffd0c0',0.4+0.3*ph):mixc(base,'#5a1a30',0.25);
      wcol=mixc(wcol,'#1a0810',dark);
      if(i>=N-6) wcol=mixc(wcol,g.sec.glow,(i-(N-6)+1)/6*0.92);
      pie(g.cx,g.cy,g.r,(psi-WAVE_HALF)*DEG,(psi+WAVE_HALF)*DEG,wcol);
    }
    if(g.sec.villi && i<22 && g.r<260){
      var vc=mixc('#f4b0a8','#1a0810',dark);
      var len=Math.max(2,g.r*0.09);
      for(var k=0;k<12;k++){
        var ang=(k/12)*Math.PI*2+hash(g.idx*7+k)*0.5;
        var cs=Math.cos(ang), sn=Math.sin(ang), th=g.r>60?2:1;
        for(var q=0;q<len;q+=1){
          rect(Math.round(g.cx+cs*(g.r-q)),Math.round(g.cy+sn*(g.r-q)),th,th,vc);
        }
      }
    }
  }
  /* obstacles far -> near, car inserted at its depth */
  var carDrawn=false;
  for(i=L-1;i>=0;i--){
    var h=rings[i];
    if(!carDrawn && h.z<ZC){ drawCar(rings,frac); carDrawn=true; }
    if(i===cap) continue;
    var o=OBS[h.w];
    if(o && h.z>=0.35){
      drawGateRing(h.cx,h.cy,h.r,o,Math.min(0.6,(i/N)*0.65));
    }
  }
  if(!carDrawn) drawCar(rings,frac);
  if(S.flash>0.01){
    ctx.fillStyle='rgba(255,60,40,'+(S.flash*0.35).toFixed(2)+')';
    ctx.fillRect(0,0,W,H);
  }
}

function drawCar(rings,frac){
  var fi=ZC-1+frac, i0=Math.floor(fi), t=fi-i0;
  var a=rings[Math.min(i0,rings.length-1)], c=rings[Math.min(i0+1,rings.length-1)];
  var cx=a.cx+(c.cx-a.cx)*t, cy=a.cy;
  var wcar=S.pos+ZC*ZSTEP;
  var r=R0*rs(wcar)/ZC;
  var th=S.th*DEG;
  var px=cx+Math.cos(th)*r*0.97, py=cy+Math.sin(th)*r*0.97;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(th-Math.PI/2);
  var sc=r/100;
  ctx.scale(sc,sc);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(carC,-16,-24);
  ctx.restore();
}

/* ---------- HUD ---------- */
var hSec=document.getElementById('hSec'),hSpd=document.getElementById('hSpd'),hTime=document.getElementById('hTime');
var fMark=document.getElementById('fMark'),fSegs=document.getElementById('fSegs');
var hpFill=document.getElementById('hpFill'),hpNum=document.getElementById('hpNum');
var gaugeFill=document.getElementById('gaugeFill'),msgEl=document.getElementById('msg');
var segColors=['#c06a74','#9a4260','#b05e56','#843040'];
(function(){
  var h='',x0=18,x1=258,n=SECTIONS.length;
  for(var i=0;i<n;i++){
    var xa=(i===0)?0:x0+SECTIONS[i].s/END*(x1-x0);
    var xb=(i+1<n)?x0+SECTIONS[i+1].s/END*(x1-x0):300;
    h+='<rect x="'+xa.toFixed(1)+'" y="0" width="'+(xb-xa+0.6).toFixed(1)+'" height="56" fill="'+segColors[i]+'"/>';
  }
  fSegs.innerHTML=h;
})();
function fmt(t){
  var m=Math.floor(t/60), s=Math.floor(t%60), c=Math.floor((t*100)%100);
  return m+"'"+(s<10?'0':'')+s+'"'+(c<10?'0':'')+c;
}
function showMsg(text,sec){ S.msg=text; S.msgT=sec; msgEl.textContent=text; msgEl.className='on'; }
function hud(){
  var wc=S.pos+ZC*ZSTEP;
  hSec.textContent='いま：'+sectionAt(wc).n;
  hSpd.textContent=Math.round(S.speed*1.7)+' km/h';
  hTime.textContent=fmt(S.time);
  fMark.setAttribute('transform','translate('+(18+Math.min(1,wc/END)*240).toFixed(1)+',0)');
  gaugeFill.style.width=(S.boost*100)+'%';
  hpFill.style.width=S.hp+'%'; hpNum.textContent=Math.round(S.hp);
  hpFill.style.background=S.hp>50?'#e0524a':(S.hp>25?'#e08a3a':'#ff3030');
  gaugeFill.style.background=(btnB||keyB)&&S.boost>0.02?'#fff3b0':'#ffb347';
}

/* ---------- loop ---------- */
var last=0;
var bangEl=document.getElementById('bang');
function showBang(txt,cls,sec){ bangEl.textContent=txt; bangEl.className=cls; S.bangT=sec; }
function hurt(kind){
  var boosting=(btnB||keyB)&&S.boost>0.02;
  var dmg=(kind==='hit'?22:8)*(boosting?2:1);
  S.hp=Math.max(0,S.hp-dmg); S.hits++;
  if(S.hp<=0){
    S.faint=2.5; S.faints++; S.stun=0; S.boost=Math.max(S.boost,0.3);
    showBang('！！！！','s3',2.5); showMsg('宿主が悶絶！',2.5); S.shake=8; S.flash=1;
  } else if(kind==='hit'){
    showBang('！','s2',0.7); S.shake=5; S.flash=1;
  } else {
    showBang('！','s1',0.5); S.shake=2;
  }
}
function resolveGate(o){
  var d=angDiff(S.th,o.gap);
  var ok=o.half-6, gr=o.half+4;
  if(d<=ok){ showMsg('ナイス！',0.6); }
  else if(d<=gr){ S.stun=Math.min(S.stun,0.75); S.speed*=0.8; showMsg('かすった！',0.7); hurt('graze'); }
  else { S.stun=Math.min(S.stun,0.35); S.speed*=0.4; showMsg('ガリッ！',0.9); hurt('hit'); }
}
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  S.clock+=dt;
  var inp=((keyL||btnL)?1:0)-((keyR||btnR)?1:0);
  if((S.state==='run'&&S.faint<=0)||S.state==='count'){
    if(S.touchOn){
      var diff=((S.touchAng-S.th+540)%360)-180;
      var stp=Math.max(-180*dt,Math.min(180*dt,diff));
      S.th+=stp;
    }
    S.th+=inp*dt*180;
    S.th=((S.th%360)+360)%360;
  }
  if(S.state==='count'){
    S.cd-=dt;
    var num=document.getElementById('cdNum');
    if(S.cd<=0){
      S.state='run';
      document.getElementById('ovCount').classList.add('hidden');
    } else {
      num.textContent=Math.ceil(S.cd);
    }
  } else if(S.state==='run'){
    var wc0=S.pos+ZC*ZSTEP;
    var boosting=(btnB||keyB)&&S.boost>0.02&&S.faint<=0;
    S.onWave=false;
    var zone=zoneAt(wc0);
    if(zone && angDiff(S.th,waveCenter(zone,wc0))<=WAVE_HALF) S.onWave=true;
    var mult=(boosting?1.5:1)*(S.onWave?1.35:1)*S.stun;
    if(S.faint>0){
      S.faint-=dt; mult=0; boosting=false;
      S.shake=Math.max(S.shake,3+Math.random()*3);
      S.flash=Math.max(S.flash,0.4+0.4*Math.sin(S.clock*30));
      S.speed*=Math.max(0,1-dt*10);
      if(S.faint<=0){ S.hp=50; S.stun=0.6; showBang('','',0); showMsg('宿主が復帰！',0.9); }
    }
    S.speed+=(BASE*mult-S.speed)*Math.min(1,dt*5);
    if(boosting) S.boost=Math.max(0,S.boost-0.5*dt); else S.boost=Math.min(1,S.boost+0.1*dt);
    S.stun+=(1-S.stun)*Math.min(1,dt*1.4);
    S.pos+=S.speed*dt;
    S.time+=dt;
    var wc=S.pos+ZC*ZSTEP;
    for(var i=0;i<OBSLIST.length;i++){
      var o=OBSLIST[i];
      if(!o.done && wc>=o.w){ o.done=true; resolveGate(o); }
    }
    if(S.onWave && S.msgT<=0) showMsg('波に乗った！',0.3);
    if(wc>=END){ startExit(); }
  } else if(S.state==='exit'){
    S.exitT+=dt;
    if(S.exitT<1.4) S.shake=Math.max(S.shake,3);
    if(!S.exitBang && S.exitT>=1.4){
      S.exitBang=true; showBang('！','s2',0.9); showMsg('ポンッ！ 排出！',1.3); S.shake=5; S.flash=0.6;
    }
    if(S.exitT>=EXIT_T) finish();
  }
  if(S.msgT>0){ S.msgT-=dt; if(S.msgT<=0) msgEl.className=''; }
  if(S.bangT>0){ S.bangT-=dt; if(S.bangT<=0) bangEl.className=''; }
  S.shake*=Math.max(0,1-dt*8);
  S.flash*=Math.max(0,1-dt*4);
  camX=(Math.random()-0.5)*S.shake; camY=(Math.random()-0.5)*S.shake;
  render(); hud();
  requestAnimationFrame(frame);
}
function startExit(){
  S.state='exit'; S.exitT=0; S.exitBang=false; S.speed=0; S.faint=0;
  bangEl.className=''; S.bangT=0; msgEl.className=''; S.msgT=0;
}
function finish(){
  S.state='done'; S.speed=0;
  var rec=(S.best===null||S.time<S.best);
  if(rec){ S.best=S.time; try{ localStorage.setItem('funa-best',String(S.time)); }catch(e){} }
  document.getElementById('doneTitle').textContent=rec?'新記録！ 排出完了！':'排出完了！';
  var rank,cmt;
  if(S.faints===0&&S.hits===0){ rank='ノーダメ賞'; cmt='宿主に優しいドライバー。胃も腸も無傷です。'; }
  else if(S.faints===0&&S.hits<=3){ rank='ほぼ無傷'; cmt='宿主は少し「あれ？」となった程度。'; }
  else if(S.faints===0){ rank='ちょっと痛かった'; cmt='宿主は終始おなかをさすっていました。'; }
  else if(S.faints<=2){ rank='配慮が足りない'; cmt='宿主が悶絶しました。次は優しく。'; }
  else { rank='人体への配慮なし'; cmt='宿主は何度も悶絶。RTAとしては優秀です。'; }
  document.getElementById('doneInfo').innerHTML='排出タイム '+fmt(S.time)+'　ベスト '+fmt(S.best)+'<br>ぶつかった回数 '+S.hits+'　悶絶 '+S.faints+'回<br>評価：'+rank+'<br>'+cmt;
  document.getElementById('ovDone').classList.remove('hidden');
  updateBest();
}
function updateBest(){
  var t=S.best===null?'':'　ベスト '+fmt(S.best);
  document.getElementById('best').textContent=t;
  document.getElementById('bestStart').textContent=S.best===null?'':'ベスト '+fmt(S.best);
}

function startRun(){
  S.pos=0;S.speed=0;S.th=90;S.boost=1;S.stun=1;S.time=0;S.shake=0;S.flash=0;S.touchOn=false;
  S.exitT=0;S.exitBang=false;S.hp=100;S.hits=0;S.faints=0;S.faint=0;S.bangT=0;bangEl.className='';

  S.state='count'; S.cd=3;

var selEl=document.getElementById('select'),gameEl=document.getElementById('game'),faceWrap=document.getElementById('faceWrap');
var entering=false;
function enterFish(){
  if(entering) return; entering=true;
  faceWrap.classList.add('zoom');
  setTimeout(function(){
    selEl.style.display='none'; gameEl.style.display='block';
    faceWrap.classList.remove('zoom'); entering=false;
    startRun();
  },1050);
}
function showSelect(){
  S.state='ready'; S.pos=0;
  document.getElementById('ovDone').classList.add('hidden');
  gameEl.style.display='none'; selEl.style.display='flex';
  updateBest();
}
document.getElementById('btnStart').addEventListener('click',enterFish);
document.getElementById('btnMenu').addEventListener('click',showSelect);
document.getElementById('btnAgain').addEventListener('click',startRun);
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'){keyL=true;e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'){keyR=true;e.preventDefault();}
  if(e.key===' '||e.key==='ArrowUp'){keyB=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a') keyL=false;
  if(e.key==='ArrowRight'||e.key==='d') keyR=false;
  if(e.key===' '||e.key==='ArrowUp') keyB=false;
});
function hold(el,on,off){
  el.addEventListener('pointerdown',function(e){ try{el.setPointerCapture(e.pointerId);}catch(_){} on(); e.preventDefault(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(n){ el.addEventListener(n,off); });
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
hold(document.getElementById('btnL'),function(){btnL=true;},function(){btnL=false;});
hold(document.getElementById('btnR'),function(){btnR=true;},function(){btnR=false;});
hold(document.getElementById('btnBoost'),function(){btnB=true;},function(){btnB=false;});

var wrap=document.getElementById('wrap');
function setTouch(e){
  var r=wrap.getBoundingClientRect();
  var nx=(e.clientX-r.left)/r.width*W, ny=(e.clientY-r.top)/r.height*H;
  var vx=nx-W/2, vy=ny-CY;
  if(vx*vx+vy*vy<144){ S.touchOn=false; return; }
  S.touchAng=((Math.atan2(vy,vx)/DEG)+360)%360;
  S.touchOn=true;
}
wrap.addEventListener('pointerdown',function(e){
  if(e.target.tagName==='BUTTON') return;
  setTouch(e);
});
wrap.addEventListener('pointermove',function(e){ if(S.touchOn) setTouch(e); });
['pointerup','pointercancel','pointerleave'].forEach(function(n){
  wrap.addEventListener(n,function(){S.touchOn=false;});
});

updateBest();
if(window.__TEST__){ window.__TEST__.S=S; window.__TEST__.OBSLIST=OBSLIST; window.__TEST__.zoneAt=zoneAt; window.__TEST__.waveCenter=waveCenter; window.__TEST__.start=startRun; window.__TEST__.setBoost=function(v){btnB=v;}; window.__TEST__.END=END; window.__TEST__.ZC=ZC; window.__TEST__.ZSTEP=ZSTEP; }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
